version: "3.9"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_USER: marketiq
      POSTGRES_PASSWORD: marketiq
      POSTGRES_DB: marketiq
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend:
    build: ./marketiq/backend
    restart: always
    depends_on:
      - db
    env_file:
      - marketiq/backend/.env
    ports:
      - "8000:8000"

  dashboard:
    build: ./marketiq/backend
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  timescale_data: